<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="icon-title">
  <title id="icon-title">mini-spring-boot</title>

  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7CC94A"/>
      <stop offset="0.55" stop-color="#5AA834"/>
      <stop offset="1" stop-color="#2F6B1C"/>
    </linearGradient>

    <linearGradient id="bean" x1="0.25" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#FFFCF3"/>
      <stop offset="1" stop-color="#EEDCB8"/>
    </linearGradient>

    <radialGradient id="gloss" cx="0.3" cy="0.12" r="0.95">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 容器：refresh() 跑完的那块地 -->
  <rect width="256" height="256" rx="58" fill="url(#badge)"/>
  <rect width="256" height="256" rx="58" fill="url(#gloss)"/>

  <!-- 拦截器链：一圈虚线轨道，把 bean 包起来 -->
  <g transform="rotate(-38 128 128)">
    <ellipse cx="128" cy="128" rx="94" ry="62"
             fill="none" stroke="#FFFFFF" stroke-opacity="0.5"
             stroke-width="4" stroke-dasharray="0.1 13" stroke-linecap="round"/>
  </g>

  <!-- bean：被容器造出来的那个成品 -->
  <g transform="rotate(-38 128 128)">
    <ellipse cx="128" cy="128" rx="62" ry="43" fill="url(#bean)"/>
    <path d="M74 128 C104 100 152 156 182 128"
          fill="none" stroke="#2F6B1C" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
